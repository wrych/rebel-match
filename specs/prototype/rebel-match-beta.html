    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    const resourceBlobs = {};

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&

    // consumers read these Blobs directly. Survives the swap like the error sink.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

2Fspan>\n              <span style=\"font-family:'JetBrains Mono', monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:{{ s.fg }}\">{{ s.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"rmScroll\" style=\"flex:1 1 auto;overflow-y:auto;overflow-x:hidden\">\n\n      <sc-if value=\"{{ isWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:44px 26px 30px;min-height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:30px;animation:rmIn 0.3s ease both\">\n\n          <div style=\"display:grid;gap:18px\">\n            <h1 style=\"margin:0;font-family:Anton, Archivo, sans-serif;font-size:62px;line-height:1.06;letter-spacing:0.004em;color:{{ markA }};display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px\">\n              <span>REBEL<br><span style=\"color:{{ markB }}\">MATCH<\u002Fspan><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono', monospace;font-size:11px;font-weight:700;letter-spacing:0.16em;color:{{ accent }};border:1.5px solid {{ accent }};border-radius:999px;padding:5px 11px;margin-bottom:12px\">BETA<\u002Fspan>\n            <\u002Fh1>\n            <p style=\"margin:0;font-size:16.5px;line-height:1.38;color:#3B3830;max-width:33ch;text-wrap:pretty\">Corporate Rebels connects the organizations replacing bureaucracy with better systems. Rebel Match is where the members help each other do the work.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;gap:12px\">\n            <button sc-camel-on-click=\"{{ goSubmit }}\" style=\"background:{{ accent }};color:#fff;border:{{ stickerBd }};border-radius:18px;padding:24px;text-align:left;display:grid;gap:8px;box-shadow:{{ stickerSh }};transform:{{ tiltA }}\" style-hover=\"background:{{ accentHover }}\">\n              <span style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1.05\">Ask for help<\u002Fspan>\n              <span style=\"font-size:15.5px;line-height:1.35;opacity:0.9;text-wrap:pretty\">Bring your challenge and we find the members living it, the ones who solved it, and the case studies that apply.<\u002Fspan>\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goSwipe }}\" style=\"background:{{ doorBg }};color:{{ doorFg }};border:{{ stickerBd }};border-radius:18px;padding:24px;text-align:left;display:grid;gap:8px;box-shadow:{{ stickerSh }};transform:{{ tiltB }}\" style-hover=\"background:{{ doorHover }}\">\n              <span style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1.05\">Offer help<\u002Fspan>\n              <span style=\"font-size:15.5px;line-height:1.35;opacity:0.76;text-wrap:pretty\">Swipe through other members' challenges and say where you can share experience or where you're in the same boat.<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSubmit }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:24px 24px 30px;display:flex;flex-direction:column;gap:16px;animation:rmIn 0.28s ease both\">\n          <h2 style=\"margin:0;font-family:Anton, Archivo, sans-serif;font-size:34px;line-height:0.94;color:#111010\">WHAT'S YOUR<br>CHALLENGE?<\u002Fh2>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.4;color:#3B3830;text-wrap:pretty\">One challenge, in your own words. Be specific: what do you observe, what do you want to change, and where are you struggling?<\u002Fp>\n          <textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" rows=\"8\" style=\"width:100%;border:2.5px solid #111010;border-radius:14px;padding:15px;font-size:16px;line-height:1.4;color:#111010;background:{{ fieldBg }};box-shadow:{{ fieldSh }};resize:none;outline:none\"><\u002Ftextarea>\n          <button sc-camel-on-click=\"{{ analyse }}\" disabled=\"{{ analyseDisabled }}\" style=\"background:{{ analyseBg }};color:#fff;border:0;border-radius:999px;padding:17px;font-family:'JetBrains Mono', monospace;font-size:12.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;min-height:54px\">Submit<\u002Fbutton>\n          <div style=\"display:grid;gap:7px;border-top:1px solid {{ line }};padding-top:15px\">\n            <span style=\"font-family:'JetBrains Mono', monospace;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8579\">Examples<\u002Fspan>\n            <sc-for list=\"{{ examples }}\" as=\"ex\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ ex.onUse }}\" style=\"text-align:left;background:transparent;border:0;border-bottom:1px solid #E7E1D4;padding:9px 0;font-size:14px;line-height:1.3;color:#6B6659\" style-hover=\"color:{{ accent }}\">{{ ex.short }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDomain }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:24px 24px 30px;display:flex;flex-direction:column;gap:18px;animation:rmIn 0.28s ease both\">\n          <div style=\"display:grid;gap:9px\">\n            <h2 style=\"margin:0;font-family:Anton, Archivo, sans-serif;font-size:30px;line-height:0.96;color:#111010\">YOUR DOMAIN<\u002Fh2>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.4;color:#3B3830;text-wrap:pretty\">We try to categorize each challenge under one of the 8 trends. This helps us find case studies and potential sparring partners for you. Please correct us if our assumption is wrong.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:10px\">\n            <div style=\"background:{{ tokenBg }};color:{{ tokenFg }};border:{{ cardBd }};box-shadow:{{ cardSh }};border-radius:16px;padding:20px;display:grid;gap:10px;animation:rmToken 0.5s cubic-bezier(0.2,1.5,0.4,1) both\">\n              <div style=\"font-family:'JetBrains Mono', monospace;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:{{ accent }};font-weight:700\">Trend {{ pickNumPlain }} of 8<\u002Fdiv>\n              <div style=\"font-family:Anton, Archivo, sans-serif;font-size:29px;line-height:1.0;text-transform:uppercase\">{{ pickTitle }}<\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono', monospace;font-size:10.5px;color:{{ tokenMeta }};letter-spacing:0.03em\">{{ pickFrom }} → {{ pickTitle }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono', monospace;font-size:10.5px;letter-spacing:0.05em;color:{{ accent }};animation:rmCount 1.1s ease both\">{{ peerLine }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ openTrends }}\" style=\"background:transparent;color:#111010;border:1px solid #C9C2B4;border-radius:13px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px\" style-hover=\"border-color:#111010\">\n            <span style=\"font-family:'JetBrains Mono', monospace;font-size:11px;font-weight:700;letter-spacing:0.11em;text-transform:uppercase\">See all 8 trends<\u002Fspan>\n            <span style=\"font-size:17px;line-height:1;color:#8A8579\">›<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goMatches }}\" style=\"background:{{ accent }};color:#fff;border:0;border-radius:999px;padding:17px;font-family:'JetBrains Mono', monospace;font-size:12.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;min-height:54px\" style-hover=\"background:#B93A16\">Confirm<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMatches }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:22px 24px 30px;display:flex;flex-direction:column;gap:20px;animation:rmIn 0.28s ease both\">\n          <div style=\"display:grid;gap:11px\">\n            <span style=\"justify-self:start;font-family:'JetBrains Mono', monospace;fon px;font-size:13px;font-weight:700;min-height:44px;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#111010;color:#fff\">Connect<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;gap:11px;border-top:1px solid {{ line }};padding-top:17px\">\n            <h3 style=\"margin:0;font-family:Anton, Archivo, sans-serif;font-size:20px;letter-spacing:0.01em;color:#111010;text-transform:uppercase\">Been there<\u002Fh3>\n            <sc-for list=\"{{ beenThere }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"border:1.5px solid {{ followBd }};border-radius:14px;padding:14px;display:grid;gap:11px;background:{{ fieldBg }}\">\n                <div style=\"display:grid;gap:3px\">\n                  <span style=\"font-size:15.5px;font-weight:700;color:#111010\">{{ p.name }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono', monospace;font-size:10.5px;color:#6B6659\">{{ p.meta }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.35;color:#3B3830\">{{ p.note }}<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ p.onAsk }}\" style=\"background:{{ p.btnBg }};color:{{ p.btnFg }};border:1px solid #111010;border-radius:999px;padding:12px;font-size:13px;font-weight:700;min-height:44px\">{{ p.btnLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;gap:11px;border-top:1px solid {{ line }};padding-top:17px\">\n            <h3 style=\"margin:0;font-family:Anton, Archivo, sans-serif;font-size:20px;letter-spacing:0.01em;color:#111010;text-transform:uppercase\">Case studies<\u002Fh3>\n            <sc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <a href=\"{{ c.url }}\" target=\"_blank\" style=\"display:grid;gap:5px;background:{{ caseBg }};colo te({ screen: 'matches', trend: trend.n, myPosted: { text: st.draft, trend: trend.n, state: myState } });\n        this.bump('ask', 1);\n      },\n\n      tracks: tracks,\n      milestoneOpen: !!st.milestone,\n      milestone: st.milestone\n        ? Object.assign({}, st.milestone, {\n            n: String(st.milestone.n),\n            bg: st.milestone.kind === 'ask' ? accent : '#FAF8F4',\n            fg: st.milestone.kind === 'ask' ? '#fff' : '#111010',\n            bd: st.milestone.kind === 'ask' ? accent : '#FAF8F4'\n          })\n        : { n: '', kicker: '', title: '', body: '', cta: '', bg: accent, fg: '#fff', bd: accent },\n      closeMilestone: () => this.setState({ milestone: null }),\n      demoAsk: () => this.demoJump('ask'),\n      demoHelp: () => this.demoJump('help'),\n\n      draft: st.draft,\n      onDraft: e => this.setState({ draft: e.target.value }),\n      analyseDisabled: st.draft.trim().length < 12,\n      analyseBg: st.draft.trim().length < 12 ? '#C9C2B4' : accent,\n      analyse: () => this.setState({ screen: 'domain', trend: this.detect(st.draft).n }),\n      examples: [\n        { short: 'Nobody knows who can decide what.', full: 'We want to distribute power and decision-making, but now we struggle with the question who actually can decide what topics.' },\n        { short: 'Roles and circles, old salary model.', full: 'We went from classical hierarchical positions to roles and circles. Now we are facing backlash because our salary model still reflects the old reality. How can we develop a new salary model suited for a role-based organization?' },\n        { short: 'Peer feedback instead of annual reviews.', full: 'We want to replace the annual performance review with a peer feedback model where employees give each other feedback regularly. Which approaches are suitable, and how do we implement it?' },\n        { short: 'A shadow organisation beside the official one.', full: 'We introduced roles and circles and delegated responsibility, yet employees still behave as if we were back in the old hierarchical structure. A kind of shadow organization operates alongside our official structure. How do we get this under control?' }\n      ].map(ex => ({ short: ex.short, onUse: () => this.setState({ draft: ex.full, trend: null }) })),\n\n      pickNum: trend.n, pickNumPlain: String(parseInt(trend.n, 10)), peerLine: '+ you · ' + (trend.peers + 1) + ' rebels working on this trend', pickTitle: trend.short, pickFrom: trend.from,\n      altTrends: this.trends.filter(t => t.n !== trend.n).map(t => ({ short: t.short, onPick: () => this.setState({ trend: t.n }) })),\n      openTrends: () => this.setState({ sheet: 'trends' }),\n      trendList: this.trends.map(t => {\n        const cur = t.n === trend.n;\n        return {\n          num: String(parseInt(t.n, 10)), short: t.short, from: t.from,\n          tag: cur ? 'Your challenge' : (t.peers + ' rebels'),\n          bg: cur ? '#111010' : 'transparent', fg: cur ? '#FAF8F4' : '#111010',\n          bd: cur ? '#111010' : '#DED8CC',\n          metaFg: cur ? '#9A948A' : '#8A8579',\n          tagFg: cur ? accent : '#8A8579',\n          onPick: () => this.setState({ trend: t.n, sheet: null })\n        };\n      }),\n\n      myChallenge: myText,\n      myState: myState, myStateBg: ch.bg, myStateFg: ch.fg, myStateBd: ch.bd, myStateDash: ch.dash,\n      sameBoat: sameBoat, beenThere: beenThere, cases: cases,\n\n      followLabel: isFollowing ? 'Following \\u201C' + trend.short + '\\u201D' : 'Follow \\u201C' + trend.short + '\\u201D',\n      followBg: isFollowing ? '#111010' : 'transparent',\n      followFg: isFollowing ? '#FAF8F4' : '#111010',\n      toggleFollow: () => {\n        const has = st.follow.indexOf(trend.n) !== -1;\n        this.setState({ follow: has ? st.follow.filter(x => x !== trend.n) : st.follow.concat([trend.n]) });\n      },\n      nominateLabel: st.nominated ? 'Frontier nomination sent' : 'Nominate as frontier',\n      nominate: () => { if (!st.nominated) { this.setState({ nominated: true }); this.flash('Sent. HQ confirms frontier flags weekly.'); } },\n\n      hasCard: !!card, deckEmpty: !card,\n      card: card ? (function (self) {\n        const c = self.chip(self.stateMap[card.t] || 'Shared');\n        return {\n          trend: self.trendBy(card.t).short, state: self.stateMap[card.t] || 'Shared',\n          chipBg: c.bg, chipFg: c.fg, chipBd: c.bd, chipDash: c.dash,\n          text: card.text, author: card.author, org: card.org, sector: card.sector,\n          caseLabel: (self.cases[card.t] || []).length + ' case studies in this domain →'\n        };\n      })(this) : { trend: '', state: '', chipBg: 'transparent', chipFg: '#fff', chipBd: '#fff', chipDash: 'solid', text: '', author: '', org: '', sector: '', caseLabel: '' },\n      swipeProgress: 'Card ' + Math.min(st.deckIdx + 1, deck.length) + ' of ' + deck.length,\n      showSwipeHint: st.deckIdx === 0,\n      prevDisabled: st.deckIdx === 0,\n      prevOpacity: st.deckIdx === 0 ? 0.32 : 1,\n      cardShift: 'translateX(' + st.dragX + 'px) rotate(' + (st.dragX * 0.032).toFixed(2) + 'deg)',\n      cardTrans: st.dragEase ? 'transform 0.19s cubic-bezier(0.4,0,0.6,1)' : 'none',\n      goPrev: () => this._go(-1),\n      goNext: () => this._go(1),\n      onCardDown: (e) => {\n        if (e.target.closest('button')) return;\n        this._drag = { x: e.clientX };\n        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}\n        this.setState({ dragEase: false });\n      },\n      onCardMove: (e) => {\n        if (!this._drag) return;\n        this.setState({ dragX: e.clientX - this._drag.x });\n      },\n      onCardUp: () => {\n        if (!this._drag) return;\n        this._drag = null;\n        const dx = this.state.dragX;\n        if (dx < -66) this._go(1);\n        else if (dx > 66) this._go(-1);\n        else this.setState({ dragX: 0, dragEase: true });\n      },\n      swipeTally: st.tally.same + ' same · ' + st.tally.exp + ' shared',\n      interestedLabel: card && st.follow.indexOf(card.t) !== -1 ? 'Following This Topic' : 'Follow This Topic',\n      openCases: () => this.setState({ sheet: 'cases', sheetCard: card }),\n      onSame: () => {\n        if (!card) return;\n        const p = this.people.find(x => x.name === card.author) || { name: card.author, org: card.org, sector: card.sector, role: '' };\n        this.setState({ tally: { same: st.tally.same + 1, exp: st.tally.exp }, deckIdx: st.deckIdx + 1, sheet: 'match', revealPerson: p, revealText: card.text });\n      },\n      onExp: () => {\n        if (!card) return;\n        const p = this.people.find(x => x.name === card.author) || { name: card.author, org: card.org, sector: card.sector, role: '' };\n        this.setState({ sheet: 'offer', offerTarget: p, offerNote: '', offerLink: '', pendingAdvance: true });\n      },\n      onSkip: () => this.setState({ deckIdx: st.deckIdx + 1 }),\n      onFollow: () => {\n        if (!card) return;\n        const has = st.follow.indexOf(card.t) !== -1;\n        this.setState({ follow: has ? st.follow.filter(x => x !== card.t) : st.follow.concat([card.t]) });\n      },\n      emptyCopy: st.tally.same + ' instant matches, ' + st.tally.exp + ' offers sent. What members swipe tells HQ which topics need a session.',\n\n      sheetOpen: !!st.sheet,\n      sheetMatch: st.sheet === 'match', sheetOffer: st.sheet === 'offer',\n      sheetCases: st.sheet === 'cases', sheetChallenge: st.sheet === 'challenge', sheetTrends: st.sheet === 'trends',\n      closeSheet: () => this.setState({ sheet: null }),\n\n      reveal: revealP ? {\n        name: revealP.name, first: this.first(revealP.name),\n        meta: (revealP.role ? revealP.role + ' · ' : '') + revealP.org + ' · ' + revealP.sector,\n        contact: this.email(revealP), initials: this.initials(revealP.name),\n        mailto: this.mailto(revealP, 'Rebel Match — same boat', 'Hi ' + this.first(revealP.name) + ',\\n\\nRebel Match matched us: we are stuck on the same challenge.\\n\\n\"' + (st.revealText || '') + '\"\\n\\nWant to compare notes?\\n\\n')\n      } : { name: '', first: '', meta: '', contact: '', mailto: '#', initials: '' },\n\n      offer: offer ? { first: this.first(offer.name) } : { first: '' },\n      flightOpen: !!st.flight,\n      flight: st.flight || { initials: '', label: '' },\n      offerNote: st.offerNote, offerLink: st.offerLink,\n      onOfferNote: e => this.setState({ offerNote: e.target.value }),\n      onOfferLink: e => this.setState({ offerLink: e.target.value }),\n      offerDisabled: st.offerNote.trim().length < 5,\n      offerBg: st.offerNote.trim().length < 5 ? '#C9C2B4' : '#111010',\n      sendOffer: () => {\n        if (st.offerNote.trim().length < 5 || !offer) return;\n        this.setState({\n          asked: Object.assign({}, st.asked, { [offer.name]: true }),\n          sheet: null,\n          deckIdx: st.pendingAdvance ? st.deckIdx + 1 : st.deckIdx,\n          tally: st.pendingAdvance ? { same: st.tally.same, exp: st.tally.exp + 1 } : st.tally,\n          pendingAdvance: false\n        });\n        this.setState({ flight: { initials: this.initials(offer.name), label: 'Your experience is on its way\\nto ' + this.first(offer.name) } });\n        clearTimeout(this._f);\n        this._f = setTimeout(() => {\n          this.setState({ flight: null });\n          this.flash('Sent to ' + this.first(offer.name) + '. They decide whether to connect.');\n          this.bump('help', 1);\n        }, 1600);\n      },\n\n      sheetCaseTrend: sheetCard ? this.trendBy(sheetCard.t).short : '',\n      sheetCaseList: sheetCard ? (this.cases[sheetCard.t] || []) : [],\n\n      detail: detail ? {\n        text: detail.ch || '', name: detail.name,\n        meta: detail.role + ' · ' + detail.org + ' · ' + detail.sector,\n        mailto: this.mailto(detail, 'Rebel Match — same boat', 'Hi ' + this.first(detail.name) + ',\\n\\nWe are stuck on the same challenge. Want to compare notes?\\n\\n')\n      } : { text: '', name: '', meta: '', mailto: '#' },\n\n      hasRequests: openReq.length > 0,\n      requests: openReq.map(r => ({\n        name: r.name, meta: r.meta, note: r.note,\n        onAccept: () => { this.setState({ requests: st.requests.map(x => x === r ? Object.assign({}, x, { open: false }) : x) }); this.flash('Connected. Contact details are open on both sides.'); },\n        onDecline: () => this.setState({ requests: st.requests.map(x => x === r ? Object.assign({}, x, { open: false }) : x) })\n      })),\n      mine: mineList,\n      following: st.follow.length ? st.follow.map(n => ({ short: this.trendBy(n).short })) : [{ short: 'Nothing yet' }],\n\n      nav: [\n        { key: 'submit', label: 'Submit' }, { key: 'swipe', label: 'Swipe' }, { key: 'mine', label: 'Matches' }\n      ].map(n => {\n        const active = st.screen === n.key || (n.key === 'submit' && (st.screen === 'domain' || st.screen === 'matches'));\n        const count = n.key === 'mine' ? st.tally.same + st.tally.exp + openReq.length : 0;\n        return {\n          label: n.label, bd: active ? accent : 'transparent', fg: active ? '#111010' : '#8A8579',\n          showBadge: count > 0, badge: String(count),\n          onPick: () => this.setState({ screen: n.key, sheet: null })\n        };\n      }),\n\n      toastOpen: !!st.toast, toast: st.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major as compose.yaml and production (ADR 0024).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rebel_match_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Synthetic only. No production secret and no real attendee list ever
      # reaches CI (R-QA-5, R-SEED-5).
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/rebel_match_test
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      MAIL_DELIVERY: none
      SEED_PROFILE: dev

    steps:
      - uses: actions/checkout@v6
        with:
          # commitlint needs the history it is asked to range over.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Unit tests
        run: npm test

      - name: Migrations, from an empty database
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration

      # The same suite on PGlite, the engine development runs on, so a
      # difference between the two shows up here (ADR 0024).
      - name: Integration tests on PGlite
        run: npm run test:integration
        env:
          DATABASE_URL: ''

      - name: Build
        run: npm run build

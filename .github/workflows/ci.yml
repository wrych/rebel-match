name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Synthetic only. No production secret and no real attendee list ever
      # reaches CI (R-QA-5, R-SEED-5).
      NODE_ENV: test
      DATABASE_URL: mysql://root:test@127.0.0.1:3306/rebel_match_test
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      MAIL_TRANSPORT: outbox
      SEED_PROFILE: dev

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the history it is asked to range over.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

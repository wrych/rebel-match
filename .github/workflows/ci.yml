name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so that adding the preview label deploys at once (ADR 0028).
    # `check` runs on it too: a skipped required check would count as passed.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major as compose.yaml and production (ADR 0024).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rebel_match_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Synthetic only. No production secret and no real attendee list ever
      # reaches CI (R-QA-5, R-SEED-5).
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/rebel_match_test
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      MAIL_DELIVERY: none
      SEED_PROFILE: dev

    steps:
      - uses: actions/checkout@v6
        with:
          # commitlint needs the history it is asked to range over.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Lint, typecheck and both integration suites need nothing from each
      # other, so they run in the background beside the unit tests, and each
      # reports in its own step below. Every task runs to the end, so one run
      # shows every failure.
      - name: Start lint, typecheck and integration tests
        id: start
        run: |
          scripts/ci-parallel.sh start lint npm run lint
          scripts/ci-parallel.sh start typecheck npm run typecheck
          scripts/ci-parallel.sh start integration \
            sh -c 'npm run migrate && npm run test:integration'
          # The same suite on PGlite, the engine development runs on, so a
          # difference between the two shows up here (ADR 0024).
          scripts/ci-parallel.sh start integration-pglite \
            env DATABASE_URL= npm run test:integration

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Lint and format
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/ci-parallel.sh await lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/ci-parallel.sh await typecheck

      - name: Migrations from an empty database, then integration tests
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/ci-parallel.sh await integration

      - name: Integration tests on PGlite
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/ci-parallel.sh await integration-pglite

  # The production build, as the image every deployment runs (ADR 0025): built
  # here once per commit, beside `check`, and handed to `deploy` as a file, so
  # nothing is built twice and what deploys is what was built here. Needs no
  # credentials, so it runs for every pull request, forks included.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: app:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Non-prod deploys (ADR 0025): staging from main, and a preview for a pull
  # request that carries the `preview` label (ADR 0028). Only after `check` and
  # `build` are green, so nothing deploys from a red commit. Pull requests from
  # forks get no token from GitHub, so no preview.
  deploy:
    needs: [check, build]
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'preview') &&
       (github.event.action != 'labeled' || github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || 'dev' }}
    concurrency:
      group: deploy-${{ github.event.pull_request.number || 'staging' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write

    env:
      TARGET: ${{ github.event_name == 'push' && 'staging' || format('pr-{0}', github.event.pull_request.number) }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
      GCP_RUN_SA: ${{ vars.GCP_RUN_SA }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      MIXPANEL_TOKEN: ${{ vars.MIXPANEL_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Project number, from the identity provider
        env:
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: echo "GCP_PROJECT_NUMBER=$(echo "$PROVIDER" | cut -d/ -f2)" >> "$GITHUB_ENV"

      - name: Registry login
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Push the image built for this commit
        id: image
        env:
          REF: ${{ vars.GCP_IMAGE_REPO }}/app:${{ github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker tag "app:$GITHUB_SHA" "$REF"
          out=$(docker push "$REF")
          echo "$out"
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' <<<"$out" | tail -1)
          [[ -n "$digest" ]] || { echo "::error::no digest in the push output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          IMAGE: ${{ vars.GCP_IMAGE_REPO }}/app@${{ steps.image.outputs.digest }}
        run: scripts/deploy.sh

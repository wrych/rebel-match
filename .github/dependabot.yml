# Actions are pinned to commit SHAs so a moved tag cannot run new code with the
# deploy identities; this keeps the pins current (R-NFR-1).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

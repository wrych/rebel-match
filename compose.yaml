# An optional local Postgres. Pinned to the same major as the service in
# .github/workflows/ci.yml and production, so checks against a real server
# exercise the engine that ships (ADR 0024). Change one, change the other.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rebel
      POSTGRES_PASSWORD: rebel
      POSTGRES_DB: rebel_match
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # Named, so your dev data survives a restart. `npm run db:reset` drops it.
      - rebel-match-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'rebel', '-d', 'rebel_match']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rebel-match-db:
